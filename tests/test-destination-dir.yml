name: Test destination directory and exclude assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content and excluded files
        run: |
          mkdir -p public
          mkdir -p public/.github
          echo "<html><body>Destination dir test</body></html>" > public/index.html
          echo "This should be excluded" > public/.github/excluded.txt
          echo "This should be included" > public/included.txt

      - name: Install fake git to mock push
        run: |
          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  push)' \
            '    echo "[FAKE GIT] git push intercepted: $*"' \
            '    exit 0' \
            '    ;;' \
            '  *)' \
            '    exec /usr/bin/git "$@"' \
            '    ;;' \
            'esac' > /tmp/fake-bin/git
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: deploy
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages-test-dest
          destination_dir: 'subdir'
          force_orphan: 'true'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          exclude_assets: '.github'

      - name: Assert deploy with destination dir succeeded
        run: |
          echo "Deploy with destination_dir and exclude_assets completed successfully"
          echo "PASS"
