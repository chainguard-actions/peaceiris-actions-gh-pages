name: Test personal token with external repository and tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p public
          echo "<html><body>Personal Token Test</body></html>" > public/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN || 'placeholder-not-a-real-token' }}
          external_repository: octocat/hello-world
          publish_branch: gh-pages
          publish_dir: public
          tag_name: v1.0.0
          tag_message: "Release v1.0.0"
          user_name: release-bot
          user_email: release-bot@example.com

      - name: Assert action ran (may fail due to invalid token in local act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (deployment may fail in local act environment)"
