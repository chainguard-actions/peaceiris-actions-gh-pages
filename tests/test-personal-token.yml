name: Test personal_token with full_commit_message and external_repository inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p public && echo "Hello World" > public/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          personal_token: fake-personal-token-for-input-coverage
          publish_dir: public
          publish_branch: gh-pages-test
          full_commit_message: "chore: full custom deploy message"
          external_repository: octocat/hello-world
          force_orphan: "true"

      - name: Assert action ran (may fail due to invalid token in act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (deployment may fail in act environment)"
