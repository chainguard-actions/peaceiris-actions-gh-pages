name: Test personal_token with tag deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content
        run: |
          mkdir -p site
          echo "<html><body>Tagged Release</body></html>" > site/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          tag_name: v1.0.0
          tag_message: 'Release v1.0.0'
          user_name: release-bot
          user_email: release-bot@example.com
          force_orphan: 'true'
          disable_nojekyll: 'false'

      - name: Assert action ran (pass or fail is acceptable in test environment)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed (continue-on-error allows deployment failures in test env)"
