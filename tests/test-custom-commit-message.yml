name: Test custom commit message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content
        run: |
          mkdir -p public
          echo "<html><body>Custom commit message test</body></html>" > public/index.html

      - name: Install fake git to mock push
        run: |
          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  push)' \
            '    echo "[FAKE GIT] git push intercepted: $*"' \
            '    exit 0' \
            '    ;;' \
            '  *)' \
            '    exec /usr/bin/git "$@"' \
            '    ;;' \
            'esac' > /tmp/fake-bin/git
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: deploy
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages-test-custom-msg
          force_orphan: 'true'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          full_commit_message: 'Custom full commit message for testing'

      - name: Assert deploy with custom message succeeded
        run: |
          echo "Deploy with custom commit message completed successfully"
          echo "PASS"
