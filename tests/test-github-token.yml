name: Test github_token with user and cname inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p public && echo "Hello World" > public/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          publish_branch: gh-pages-test
          user_name: Test User
          user_email: test@example.com
          commit_message: "chore: deploy to gh-pages"
          cname: example.com
          force_orphan: "true"

      - name: Assert action ran (may fail due to permissions in act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (deployment may fail in act environment)"
