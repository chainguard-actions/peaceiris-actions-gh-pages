name: Test deploy to external repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p public
          echo "<html><body>External repository deploy test</body></html>" > public/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          publish_branch: gh-pages
          external_repository: peaceiris/peaceiris.github.io

      - name: Assert action ran (external_repository accepted, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with external_repository input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no permission to push to external repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
