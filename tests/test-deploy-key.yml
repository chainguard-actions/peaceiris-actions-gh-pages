name: Test deploy_key with tag_name and tag_message inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p public && echo "Hello World" > public/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: fake-deploy-key-for-input-coverage
          publish_dir: public
          publish_branch: gh-pages-test
          tag_name: v1.0.0
          tag_message: "Release v1.0.0"
          force_orphan: "true"

      - name: Assert action ran (may fail due to invalid deploy key in act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (deployment may fail in act environment)"
