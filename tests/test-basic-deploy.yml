name: Test basic deploy with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content
        run: |
          mkdir -p public
          echo "<html><body>Hello GitHub Pages</body></html>" > public/index.html
          echo "Test site content" > public/README.md

      - name: Install fake git to mock push
        run: |
          mkdir -p /tmp/fake-bin
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in' \
            '  push)' \
            '    echo "[FAKE GIT] git push intercepted: $*"' \
            '    exit 0' \
            '    ;;' \
            '  *)' \
            '    exec /usr/bin/git "$@"' \
            '    ;;' \
            'esac' > /tmp/fake-bin/git
          chmod +x /tmp/fake-bin/git
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: deploy
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages-test-basic
          force_orphan: 'true'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Test deploy from act'

      - name: Assert deploy succeeded
        run: |
          echo "Deploy step completed successfully"
          echo "PASS"
