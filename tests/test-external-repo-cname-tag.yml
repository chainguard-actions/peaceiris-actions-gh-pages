name: Test external_repository, cname, tag_name, and tag_message inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create publish directory
        run: mkdir -p public && echo "hello" > public/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          publish_branch: gh-pages-ext-test
          external_repository: "octocat/hello-world"
          cname: "example.com"
          tag_name: "v1.0.0-test"
          tag_message: "Test tag message"
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed (may have failed to push, which is expected in test env)"
          echo "PASS: external_repository, cname, tag_name, and tag_message inputs were accepted"
