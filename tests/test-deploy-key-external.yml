name: Test deploy_key with external repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content
        run: |
          mkdir -p dist
          echo "<html><body>External Repo Deploy</body></html>" > dist/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: peaceiris/peaceiris.github.io
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: subdir
          full_commit_message: 'Deploy: full custom commit message without hash'
          user_name: deploy-bot
          user_email: deploy-bot@example.com

      - name: Assert action ran (pass or fail is acceptable in test environment)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step completed (continue-on-error allows deployment failures in test env)"
