name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p public
          echo "<html><body>Hello</body></html>" > public/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: public
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy from test"
          allow_empty_commit: "false"
          keep_files: "false"
          force_orphan: "false"
          enable_jekyll: "false"
          disable_nojekyll: "false"
          exclude_assets: ".github"

      - name: Assert action ran (may fail due to permissions in local act)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (deployment may fail in local act environment)"
