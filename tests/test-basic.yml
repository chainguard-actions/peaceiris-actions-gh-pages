name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with content
        run: |
          mkdir -p public
          echo "<html><body>Hello GitHub Pages</body></html>" > public/index.html
          echo "Test site content" > public/README.md

      - name: Verify publish directory exists before action
        run: |
          if [ ! -d "public" ]; then
            echo "FAIL: publish directory does not exist"
            exit 1
          fi
          if [ ! -f "public/index.html" ]; then
            echo "FAIL: index.html does not exist"
            exit 1
          fi
          echo "PASS: publish directory and files exist"

      - id: deploy
        name: Deploy to GitHub Pages
        uses: .
        with:
          github_token: fake-token-for-testing
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy test'
        continue-on-error: true

      - name: Assert action was invoked
        run: |
          echo "Action step completed (with or without error due to fake token)"
          echo "outcome: ${{ steps.deploy.outcome }}"
          # The action should fail at push due to fake token, but it should start
          # If it fails with a token/auth error, that's expected behavior
          # If it fails for another reason (e.g., missing inputs), that's a problem
          if [ "${{ steps.deploy.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked"
